spring.application.name=Internal Inventory Portal
server.port=5000

# Use a proper 384-bit (48 character) secret for HS384
jwt.secret=super-secure-384-bit-jwt-secret-for-hs384-algorithm-here!

# Disable Docker Compose
spring.docker.compose.enabled=false

# Disable metrics exporters that require API keys
management.datadog.metrics.export.enabled=false
management.dynatrace.metrics.export.enabled=false
management.metrics.export.prometheus.enabled=false

# Temporary basic authentication
spring.security.user.name=admin
spring.security.user.password=password

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/deltacoolingdb
spring.datasource.username=enock
spring.datasource.password=E35623101009k.
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration for PostgreSQL
spring.flyway.url=jdbc:postgresql://localhost:5432/deltacoolingdb
spring.flyway.user=enock
spring.flyway.password=E35623101009k.
spring.flyway.enabled=false

# Other Configuration
spring.main.allow-bean-definition-overriding=true
spring.profiles.active=postgresql

# Minimal logging config to debug the issue
logging.level.com.deltacoolingsystems=DEBUG
logging.level.com.deltacoolingsystems.internalinventoryportal.controller.AuthController=TRACE